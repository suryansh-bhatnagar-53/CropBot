[project]
name = "cropbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docling==2.140.0",
    "easyocr>=1.7.2",
    "langchain>=1.3.14",
    "langchain-docling>=2.0.0",
    "langchain-experimental>=0.4.2",
    "langchain-neo4j>=0.10.0",
    "langchain-ollama>=1.1.0",
    "neo4j>=6.2.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["slow: runs a real Docling conversion (minutes; run with -m slow)"]
addopts = "-m 'not slow'"
