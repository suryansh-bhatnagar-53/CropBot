# Source registry for ../BooksData.
#
# extract.py scans the BooksData folder itself. This file adds metadata and
# include/exclude decisions per PDF, keyed by file name. A PDF dropped into
# BooksData without an entry here is still processed, with defaults, and
# `uv run extract.py --list` flags it as "unregistered".
#
# Fields (all optional except `file`):
#   id          short id used in output file names (default: slug of file name)
#   title       human title
#   doc_type    practice_guide | advisory | handbook | guideline | textbook |
#               bulletin | soil_manual | research_report | policy | unrelated
#   region      where the advice applies, e.g. "Tamil Nadu", "India"
#   season      kharif | rabi | "" (all)
#   year        edition year
#   language    en | hi | ...
#   include     false = skip entirely
#   crop        set for single-crop books: the whole book becomes one crop file
#               (a key from CROPS in extract.py)
#   ocr         "auto" (OCR only image regions) | "force" (OCR every page;
#               needed for legacy-font Hindi whose text layer is garbage)
#   ocr_lang    EasyOCR language codes, e.g. ["en"], ["hi", "en"]
#   page_range  [first, last] pages to convert (1-based, inclusive)
#   publisher, rights_note, url, note

